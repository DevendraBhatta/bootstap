<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Projects 2</title>
    <style>
        .box1 {
            width: 680px;
            height: 500px;
            background-color: rgb(149, 144, 228);
            border: 2px solid black;
            margin: 20px;
        }

        .box2 {
            width: 450px;
            height: 300px;
            background-color: rgb(243, 250, 40);
            border: 2px solid black;
            margin: 20px;
        }

        div h1,
        div h2 {
            text-align: center;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <div class="box1">
        <h1>When I say DIV</h1>
        <div class="box2">
            <h2>You Say TAG</h2>
        </div>
    </div>
</body>
</html>
