<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivTags</title>
    <style>
        .box1 {
            width: 600px;
            height: 400px;
            background-color: yellow;
            margin-bottom: 20px;
        }

        .box2 {
            width: 400px;
            height: 250px;
            background-color: pink;
        }

        .highlight-text {
            color: dimgray;
            font-size: 30px;
        }

        .box3 {
            width: 100px;
            height: 300px;
            background-color: gray;
        }

        .box4 {
            width: 350px;
            height: 120px;
            background-color: purple;
        }
    </style>
</head>

<body>
    <div class="box1">
        <div class="box3">
        </div>
    </div>

    <div class="box2">
        <div class="box4">
            <h2>Heading 2</h2>
        </div>
    </div>
</body>

</html>
