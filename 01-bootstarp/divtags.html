<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DivTags</title>
    <style>
        #yellow-box {
            width: 600px;
            height: 400px;
            background-color: yellow;
        }

        #pink-box {
            background-color: pink;
            height: 250px;
            width: 400px;
        }
    </style>
</head>

<body>
    <div id="yellow-box">
        <p>First Box</p>
    </div>

    <div id="pink-box">
        <p>Second Box</p>
    </div>
</body>

</html>
